[workspace]
resolver = "2"
members = [
    "crates/trdr-core",
    "crates/trdr-runtime",
    "crates/trdr-cli",
    "apps/desktop/src-tauri"
]
# Members are listed one by one rather than globbed, so nothing joins the
# workspace by accident. `apps/desktop/src-tauri` is the Tauri composition root:
# it owns the window, the capability file, and the typed commands, and it is the
# only member that links a GUI toolkit.
#
# `spikes/*` each declare an empty `[workspace]` table of their own and are
# excluded here as well, so a spike never resolves against these versions.
exclude = ["spikes"]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/fxylabs/trdr"
publish = false

# Every crate takes its shared dependencies from here with `workspace = true`.
# serde and specta are the pair that must never drift: tauri-specta 2.0.0-rc.25
# depends on `specta =2.0.0-rc.25`, so specta is pinned to that exact version and
# the later tauri-specta track can add it without a second specta in the tree.
[workspace.dependencies]
trdr-core = { path = "crates/trdr-core" }
trdr-runtime = { path = "crates/trdr-runtime" }

clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
# The TypeScript emitter behind the generated bindings. Pinned exactly for the
# same reason specta is: it reads specta's own data types, so a minor bump on one
# side and not the other is a type error nobody asked for.
specta-typescript = "=0.0.12"
tauri = { version = "2.11", features = [] }
tauri-build = { version = "2.5", features = [] }
# Turns the registered commands into both the Tauri handler and the TypeScript
# bindings, from one list, so the two cannot describe different surfaces.
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
thiserror = "2.0"
# Default features off drops `rand`, so the domain crate gets the ULID codec
# without gaining a way to read the clock. Generation belongs to the runtime.
ulid = { version = "3.0", default-features = false }
