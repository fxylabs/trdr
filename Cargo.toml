[workspace]
resolver = "2"
members = [
    "crates/trdr-core",
    "crates/trdr-runtime",
    "crates/trdr-cli"
]
# The Tauri composition root lands as `apps/desktop/src-tauri` in a later track.
# Members are listed one by one rather than globbed, so that track has to add its
# own line here; nothing joins the workspace by accident.
#
# `spikes/*` each declare an empty `[workspace]` table of their own and are
# excluded here as well, so a spike never resolves against these versions.
exclude = ["spikes"]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/fxylabs/trdr"
publish = false

# Every crate takes its shared dependencies from here with `workspace = true`.
# serde and specta are the pair that must never drift: tauri-specta 2.0.0-rc.25
# depends on `specta =2.0.0-rc.25`, so specta is pinned to that exact version and
# the later tauri-specta track can add it without a second specta in the tree.
[workspace.dependencies]
trdr-core = { path = "crates/trdr-core" }
trdr-runtime = { path = "crates/trdr-runtime" }

clap = { version = "4.6", features = ["derive"] }
# The one place the runtime is allowed to call libc: the writer lease is an
# `flock` on a descriptor and the socket checks its peer's uid, and neither has a
# safe equivalent in std.
libc = "0.2"
# `bundled` compiles SQLite into the binary rather than linking the one macOS
# ships, which is what section 6 means by not using the system SQLite. The
# version that comes with it is checked at test time, not assumed.
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Migration checksums (section 6.1). The same hash section 7.2 fixes for the
# domain, so there is one hash in the product rather than two.
sha2 = "0.10"
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
thiserror = "2.0"
# Default features off drops `rand`, so the domain crate gets the ULID codec
# without gaining a way to read the clock. Generation belongs to the runtime.
ulid = { version = "3.0", default-features = false }
