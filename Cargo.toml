[workspace]
resolver = "2"
members = [
    "crates/trdr-core",
    "crates/trdr-runtime",
    "crates/trdr-cli",
    "apps/desktop/src-tauri"
]
# Members are listed one by one rather than globbed, so nothing joins the
# workspace by accident. `apps/desktop/src-tauri` is the Tauri composition root:
# it owns the window, the capability file, and the typed commands, and it is the
# only member that links a GUI toolkit.
#
# `spikes/*` each declare an empty `[workspace]` table of their own and are
# excluded here as well, so a spike never resolves against these versions.
exclude = ["spikes"]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/fxylabs/trdr"
publish = false

# Every crate takes its shared dependencies from here with `workspace = true`.
# serde and specta are the pair that must never drift: tauri-specta 2.0.0-rc.25
# depends on `specta =2.0.0-rc.25`, so specta is pinned to that exact version and
# the later tauri-specta track can add it without a second specta in the tree.
[workspace.dependencies]
trdr-core = { path = "crates/trdr-core" }
trdr-runtime = { path = "crates/trdr-runtime" }

clap = { version = "4.6", features = ["derive"] }
# The one place the runtime is allowed to call libc: the writer lease is an
# `flock` on a descriptor and the socket checks its peer's uid, and neither has a
# safe equivalent in std.
libc = "0.2"
# `bundled` compiles SQLite into the binary rather than linking the one macOS
# ships, which is what section 6 means by not using the system SQLite. The
# version that comes with it is checked at test time, not assumed.
# The pseudo-terminal the agent child runs under (section 3). The M1 spike
# proved this crate against Claude Code and Codex on macOS, and the port kept
# the version it proved.
portable-pty = "0.9"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Migration checksums (section 6.1). The same hash section 7.2 fixes for the
# domain, so there is one hash in the product rather than two.
sha2 = "0.10"
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
# The TypeScript emitter behind the generated bindings. Pinned exactly for the
# same reason specta is: it reads specta's own data types, so a minor bump on one
# side and not the other is a type error nobody asked for.
specta-typescript = "=0.0.12"
# `specta` is what lets a command take an injected argument — `tauri::State` and
# friends — without that argument appearing in the generated TypeScript. Tauri
# implements specta's `FunctionArg` for them under this feature and answers "no
# type"; without it, a command that reads app state does not compile.
tauri = { version = "2.11", features = ["specta"] }
tauri-build = { version = "2.5", features = [] }
# Turns the registered commands into both the Tauri handler and the TypeScript
# bindings, from one list, so the two cannot describe different surfaces.
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
thiserror = "2.0"
# Default features off drops `rand`, so the domain crate gets the ULID codec
# without gaining a way to read the clock. Generation belongs to the runtime.
ulid = { version = "3.0", default-features = false }
